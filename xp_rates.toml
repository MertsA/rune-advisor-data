# Rough default xp/hr by level band, used only to estimate the *cost* of goals.
# These are ballpark "reasonably efficient, not sweaty" numbers, not authoritative.
# Each entry is [from_level, xp_per_hour]; the rate applies until the next band.
# Override per player in rune_advisor.toml:  [xp_rates]  Hunter = 900000

[rates]
Attack        = [[1, 50_000], [50, 200_000], [80, 450_000], [90, 650_000]]
Strength      = [[1, 50_000], [50, 200_000], [80, 450_000], [90, 650_000]]
Defence       = [[1, 50_000], [50, 200_000], [80, 450_000], [90, 650_000]]
# Hitpoints (Constitution) has no rate of its own: it's derived as 0.33x the best combat
# skill's rate (see cost.CONSTITUTION_SHARE). Set [xp_rates] Hitpoints in rune_advisor.toml to override.
